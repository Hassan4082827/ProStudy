  :root {
    --screen-bg: #000000;
    --screen-text: #ffffff;
    --screen-muted: #64748b;
    --brand-color: #ffffff;
    --neon-blue: #3b82f6;
    --glow-cyan: #60a5fa;
    --skip-bg: rgba(15, 23, 42, 0.5);
    --skip-text: #dbeafe;
  }

  body.light-mode {
    --screen-bg: #eef4ff;
    --screen-text: #0f172a;
    --screen-muted: #475569;
    --brand-color: #0f172a;
    --skip-bg: rgba(255, 255, 255, 0.7);
    --skip-text: #0f172a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--screen-bg);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: var(--screen-text);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .laser-beam {
    position: absolute;
    width: 0%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--glow-cyan), #ffffff, var(--glow-cyan), transparent);
    box-shadow: 0 0 20px var(--neon-blue), 0 0 45px var(--glow-cyan);
    animation: fireLaser 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    z-index: 10;
  }

  @keyframes fireLaser {
    0%   { width: 0%; opacity: 0; }
    40%  { width: 90%; opacity: 1; transform: scaleY(1); }
    80%  { width: 100%; opacity: 1; transform: scaleY(3.5); }
    100% { width: 0%; opacity: 0; transform: scaleY(0.2); }
  }

  .boot-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.85);
    animation: bootUnfold 5s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards;
    z-index: 5;
  }

  @keyframes bootUnfold {
    0% {
      opacity: 0;
      transform: scale(0.88);
      filter: blur(12px) brightness(2.2);
    }
    18% {
      opacity: 1;
      transform: scale(1);
      filter: blur(0px) brightness(1);
    }
    82% {
      opacity: 1;
      transform: scale(1.02);
      filter: blur(0px) brightness(1);
    }
    100% {
      opacity: 0;
      transform: scale(2.2);
      filter: blur(16px);
    }
  }

  .vector-wrap {
    position: relative;
    width: clamp(280px, 80vw, 480px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .vector-wrap svg {
    width: 100%;
    height: auto;
    display: block;
    color: var(--brand-color);
    filter: drop-shadow(0 0 25px rgba(59, 130, 246, 0.4));
  }

  .s-flare {
    position: absolute;
    left: 49%;
    top: 48%;
    transform: translate(-50%, -50%);
    width: 75px;
    height: 75px;
    background: radial-gradient(circle, rgba(96, 165, 250, 0.95) 0%, rgba(37, 99, 235, 0.45) 45%, transparent 70%);
    border-radius: 50%;
    mix-blend-mode: screen;
    animation: flarePulse 2.8s ease-in-out infinite 1.2s;
    pointer-events: none;
  }

  @keyframes flarePulse {
    0%, 100% {
      transform: translate(-50%, -50%) scale(0.7);
      opacity: 0.35;
    }
    50% {
      transform: translate(-50%, -50%) scale(1.45);
      opacity: 1;
      filter: drop-shadow(0 0 20px #60a5fa);
    }
  }

  .powered-tag {
    margin-top: 15px;
    font-size: clamp(0.65rem, 2vw, 0.8rem);
    font-weight: 800;
    color: var(--screen-muted);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeTag 1.8s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards;
  }

  @keyframes fadeTag {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .boot-footer {
    position: absolute;
    bottom: 38px;
    text-align: center;
    color: var(--screen-muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeFooter 1.6s ease 2.0s forwards;
  }

  @keyframes fadeFooter {
    to { opacity: 0.85; }
  }

  .boot-footer span {
    color: var(--glow-cyan);
    font-weight: 700;
  }

  .skip-intro {
    position: absolute;
    top: 24px;
    right: 24px;
    border: 1px solid rgba(96, 165, 250, 0.45);
    background: var(--skip-bg);
    color: var(--skip-text);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 10px 14px;
    border-radius: 999px;
    cursor: pointer;
    z-index: 20;
    opacity: 0;
    animation: fadeFooter 1.8s ease 2.2s forwards;
    transition: transform 0.2s ease, background 0.2s ease;
  }

  .skip-intro:hover {
    transform: translateY(-1px);
    background: rgba(30, 41, 59, 0.8);
  }
</style>

  <script>
    const THEME_STORAGE_KEY = 'prostudy_theme';

    function resolveEffectiveTheme(theme) {
      if (theme === 'dark') return 'dark';
      if (theme === 'light') return 'light';
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function applyBootTheme(theme) {
      const normalizedTheme = (theme === 'dark' || theme === 'light' || theme === 'system') ? theme : 'system';
      const effectiveTheme = resolveEffectiveTheme(normalizedTheme);
      document.body.classList.toggle('light-mode', effectiveTheme === 'light');
      localStorage.setItem(THEME_STORAGE_KEY, normalizedTheme);
    }

    function initializeBootTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'system';
      applyBootTheme(savedTheme);

      const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
      const updateIfSystem = () => {
        if ((localStorage.getItem(THEME_STORAGE_KEY) || 'system') === 'system') {
          applyBootTheme('system');
        }
      };

      if (typeof mediaQuery.addEventListener === 'function') {
        mediaQuery.addEventListener('change', updateIfSystem);
      } else if (typeof mediaQuery.addListener === 'function') {
        mediaQuery.addListener(updateIfSystem);
      }
    }

    initializeBootTheme();

    const introSeenKey = 'prostudy_intro_seen';
    const launchTarget = 'landing.html';
    const shouldSkipIntro = sessionStorage.getItem(introSeenKey) === 'true';

    if (shouldSkipIntro) {
      window.location.replace(launchTarget);
    } else {
      sessionStorage.setItem(introSeenKey, 'true');
      setTimeout(() => {
        window.location.replace(launchTarget);
      }, 5200);
    }

    const skipButton = document.getElementById('skip-intro');
    if (skipButton) {
      skipButton.addEventListener('click', () => {
        sessionStorage.setItem(introSeenKey, 'true');
        window.location.replace(launchTarget);
      });
    }
  </script>
