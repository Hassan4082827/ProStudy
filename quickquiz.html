<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickQuiz</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
body{font-family:Arial;margin:0;padding:20px;background:#f4f7ff;}
.qq-card{background:white;padding:15px;border-radius:15px;margin-bottom:10px;}
.qq-input{width:100%;padding:10px;margin:5px 0;}
button{padding:10px;border:none;border-radius:10px;background:#3b82f6;color:white;}
.hidden{display:none;}
</style>
</head>

<body>

<h2>QuickQuiz</h2>

<div id="setup">

<input id="q" class="qq-input" placeholder="Question">
<input id="a" class="qq-input" placeholder="Answer">

<button onclick="add()">Add</button>
<button onclick="startQuiz()">Start Quiz</button>

</div>

<div id="play" class="hidden"></div>

<h3>History</h3>
<div id="history"></div>

<script>

let quiz = [];

function add(){
    quiz.push({
        q: document.getElementById("q").value,
        a: document.getElementById("a").value.toLowerCase()
    });

    document.getElementById("q").value="";
    document.getElementById("a").value="";
}

function startQuiz(){

    if(typeof ProStudyApp !== "undefined"){
        ProStudyApp.saveFullQuiz(JSON.stringify(quiz));
    }

    renderQuiz(quiz);
}

function renderQuiz(data){

    document.getElementById("setup").classList.add("hidden");
    let div = document.getElementById("play");
    div.classList.remove("hidden");

    div.innerHTML = "";

    data.forEach((q,i)=>{
        div.innerHTML += `
        <div class="qq-card">
            <b>Q${i+1}: ${q.q}</b>
            <input class="ans" data-i="${i}" placeholder="Answer">
        </div>`;
    });
}

function loadHistory(){
    console.log("Checking for ProStudyApp...");
    if(typeof ProStudyApp !== "undefined"){
        try {
            let json = ProStudyApp.loadAllQuizzes();
            console.log("Data received: " + json);
            let data = JSON.parse(json);
            
            let h = document.getElementById("history");
            h.innerHTML = "";

            if(data.length === 0) {
                h.innerHTML = "<p>No history found.</p>";
                return;
            }

            data.forEach((item, i) => {
                // Defensive check to avoid crash if data is corrupted
                let quizData = (typeof item.data === 'string') ? JSON.parse(item.data) : item.data;

                let div = document.createElement("div");
                div.className = "qq-card";
                div.innerHTML = `<b>Quiz #${data.length - i}</b> (${quizData.length} Questions)`;
                div.onclick = function(){ renderQuiz(quizData); };
                h.appendChild(div);
            });
        } catch (e) {
            console.error("Crash prevented: " + e);
        }
    } else {
        // Retry after 500ms if bridge isn't ready yet
        setTimeout(loadHistory, 500);
    }
}

loadHistory();

</script>

</body>
</html>
