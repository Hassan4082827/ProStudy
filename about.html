<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#f4f7ff;--card:#fff;--accent:#007bff;--text:#111;--dim:#777;--success:#28a745;--warn:#ff4757;}
body{margin:0;font-family:Segoe UI,Roboto;background:var(--bg);}
.header{padding:35px 20px 25px;background:#eef3ff;border-radius:0 0 30px 30px;}
.header-top{display:flex;align-items:center;}
.back{font-size:22px;padding:10px;cursor:pointer;}
h1{margin:0 0 0 10px;font-size:26px;}
.subtitle{margin-left:45px;font-size:13px;color:var(--dim);}
.card{background:var(--card);margin:20px;padding:22px;border-radius:18px;display:flex;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.08);cursor:pointer;}
.card i{font-size:26px;color:var(--accent);margin-right:18px;}
#versions{position:fixed;top:100%;left:0;width:100%;height:100%;background:var(--bg);transition:.4s;overflow:auto;}
#versions.active{top:0;}
.hero{text-align:center;margin:15px 0 25px;}
.hero i{font-size:70px;color:#c9d3e5;animation:spin 15s linear infinite;}
@keyframes spin{100%{transform:rotate(360deg)}}
#status{font-weight:700;margin-top:10px;}
.box{background:var(--card);margin:20px;padding:10px 20px;border-radius:18px;}
.row{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid #eee;}
.row:last-child{border:none;}
.row span{color:var(--dim);}
.row b{font-family:monospace;}
.red{color:var(--warn);}
.green{color:var(--success);}
.google-btn{
    background:#fff;
    border:1px solid #dadce0;
    border-radius:16px;
    margin:20px;
    padding:14px 18px;
    display:flex;
    align-items:center;
    cursor:pointer;
    transition:.18s ease;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.google-btn:hover{
    background:#f8f9fa;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.google-btn:active{
    transform:scale(.98);
}

.google-logo{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-right:14px;
    flex-shrink:0;
}

.google-logo svg{
    width:20px;
    height:20px;
}

.google-text{
    display:flex;
    flex-direction:column;
}

.google-title{
    font-size:15px;
    font-weight:600;
    color:#202124;
}

.google-subtitle{
    font-size:12px;
    color:#5f6368;
    margin-top:2px;
}
</style>
</head>
<body>

<div class="header">
<div class="header-top">
<div class="back" onclick="location.href='dashboard.html'">
<i class="fa-solid fa-arrow-left"></i>
</div>
<h1>About ProStudy</h1>
</div>
<p class="subtitle">System configuration & build details</p>
</div>

<div class="card" onclick="toggle(true)">
<i class="fa-solid fa-code-branch"></i>
<div>
<h3>Versions</h3>
<p style="margin:4px 0;color:var(--dim)">Build & update information</p>
</div>
</div>
<div class="google-btn" id="googleBindCard"
onclick="triggerGoogleUpgrade()" style="display: none;">

<div class="google-logo">
<svg width="18" height="18" viewBox="0 0 48 48">
  <path fill="#EA4335" d="M24 9.5c3.54 0 6.73 1.22 9.24 3.6l6.9-6.9C35.9 2.3 30.4 0 24 0 14.64 0 6.56 5.38 2.6 13.22l8.04 6.24C12.6 13.3 17.8 9.5 24 9.5z"/>
  <path fill="#4285F4" d="M46.5 24.5c0-1.64-.14-3.2-.4-4.7H24v9h12.7c-.54 2.9-2.18 5.36-4.64 7l7.2 5.6C43.9 37.2 46.5 31.4 46.5 24.5z"/>
  <path fill="#FBBC05" d="M10.64 28.54A14.5 14.5 0 0 1 9.5 24c0-1.58.28-3.1.78-4.54l-8.04-6.24A24 24 0 0 0 0 24c0 3.86.92 7.5 2.56 10.78l8.08-6.24z"/>
  <path fill="#34A853" d="M24 48c6.48 0 11.92-2.14 15.9-5.82l-7.2-5.6c-2 1.34-4.56 2.12-8.7 2.12-6.2 0-11.4-3.8-13.36-9.96l-8.08 6.24C6.52 42.62 14.64 48 24 48z"/>
</svg>
</div>

<div class="google-text">
<div class="google-title">Continue with Google</div>
<div class="google-subtitle">Secure your ProStudy account</div>
</div>

</div>

<div id="versions">

<div style="padding:20px" onclick="toggle(false)">
<i class="fa-solid fa-chevron-down" style="font-size:24px"></i>
<b style="margin-left:10px">Versions</b>
</div>

<div class="hero">
<i class="fa-solid fa-gear"></i>
<h2>About ProStudy</h2>
<p id="status">Checking system status...</p>
</div>

<div class="box">

<div class="row">
<span>App Version</span>
<b id="appVersion">Loading...</b>
</div>

<div class="row">
<span>Latest App Version</span>
<b class="red">3.0.0</b>
</div>

<div class="row">
<span>Combined Version</span>
<b id="combinedVersion">3.0.0</b>
</div>

<div class="row">
<span>Content Version</span>
<b id="contentVersion">2.1.1</b>
</div>

</div>
</div>

<script>
function toggle(show) {
    document.getElementById("versions")
        .classList.toggle("active", show);
}

function triggerGoogleUpgrade() {
    if (typeof ProStudyApp !== 'undefined') {
        ProStudyApp.startGoogleSignIn();
    }
}

function syncWithJava() {
    let appLabel = document.getElementById("appVersion");
    let status = document.getElementById("status");
    let bindCard = document.getElementById("googleBindCard");

    let latestCode = 300;

    if (typeof ProStudyApp !== 'undefined') {

        bindCard.style.display = "flex";

        if (ProStudyApp.getVersionName) {
            appLabel.innerText =
                ProStudyApp.getVersionName();
        }

        if (ProStudyApp.getVersionCode) {

            let localCode = parseInt(
                ProStudyApp.getVersionCode()
            );

            if (localCode >= latestCode) {
                status.innerText =
                    "Your app is up to date";

                status.style.color =
                    "var(--success)";
            } else {
                status.innerText =
                    "Update available";

                status.style.color =
                    "var(--warn)";
            }
        }

        return true;

    } else {

        appLabel.innerText = "Web Mode";
        status.innerText = "Web Mode detected";

        bindCard.style.display = "none";

        return false;
    }
}

window.onload = () => {

    if (!syncWithJava()) {

        let attempts = 0;

        let checkLoop = setInterval(() => {

            attempts++;

            if (syncWithJava() || attempts > 10) {
                clearInterval(checkLoop);
            }

        }, 50);
    }
};
</script>

</body>
</html>
